name: Verify Merman scanner container

on:
  push:
    branches: [verify-merman-container]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install validation dependency
        run: python3 -m pip install PyYAML
      - name: Validate enrollment
        run: python3 tools/validate.py
      - name: Build using the official scanner check
        run: python3 tools/check merman --no-shell
      - name: Verify tests with networking disabled
        run: |
          docker run --rm --network none oss-scanner-check/built:merman sh -c 'cargo nextest run --offline --locked -p merman -p merman-core -p merman-render -p merman-export -p merman-ffi -p tree-sitter-mermaid --features "$MERMAN_SCAN_FEATURES" -E "test(security) | test(sanitiz) | test(resource) | test(icon_registry) | package(tree-sitter-mermaid)"'
